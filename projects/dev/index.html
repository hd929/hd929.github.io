<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Corner | P3nguinkyun</title>
  <link rel="stylesheet" href="./assets/css/reset.css" />
  <link rel="stylesheet" href="./assets/css/style.css?v=1.2" />
  <link rel="stylesheet" href="./assets/css/zero-md.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Geist + JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
</head>

<body>
  <!-- Particle animated background -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="ide-container">
    <!-- Sidebar / File Explorer -->
    <aside class="ide-sidebar">
      <div class="explorer-title">
        <i class="fa-solid fa-folder-open"></i> EXPLORER
      </div>
      <ul class="file-tree">
        <li class="tree-folder">
          <span class="folder-toggle"><i class="fa-solid fa-chevron-down"></i> <i class="fa-solid fa-folder" style="color: #bd93f9;"></i> algorithm</span>
          <ul class="folder-contents">
            <li class="tree-file" data-path="algorithm/segmenttree" onclick="changePage('algorithm/segmenttree')">
              <i class="fa-solid fa-file-code" style="color: #bd93f9;"></i> segmenttree.md
            </li>
            <li class="tree-file" data-path="algorithm/fenwicktree" onclick="changePage('algorithm/fenwicktree')">
              <i class="fa-solid fa-file-code" style="color: #8be9fd;"></i> fenwicktree.md
            </li>
            <li class="tree-file" data-path="algorithm/sparsetable" onclick="changePage('algorithm/sparsetable')">
              <i class="fa-solid fa-file-code" style="color: #ff79c6;"></i> sparsetable.md
            </li>
            <li class="tree-file" data-path="algorithm/sort" onclick="changePage('algorithm/sort')">
              <i class="fa-solid fa-file-code" style="color: #50fa7b;"></i> sort.md
            </li>
          </ul>
        </li>
        <li class="tree-folder">
          <span class="folder-toggle"><i class="fa-solid fa-chevron-down"></i> <i class="fa-solid fa-folder" style="color: #ff5555;"></i> codehub</span>
          <ul class="folder-contents">
            <li class="tree-folder">
              <span class="folder-toggle"><i class="fa-solid fa-chevron-down"></i> <i class="fa-solid fa-folder" style="color: #f1fa8c;"></i> vnoi</span>
              <ul class="folder-contents">
                <li class="tree-file" data-path="codehub/vnoi/nkpalin" onclick="changePage('codehub/vnoi/nkpalin')">
                  <i class="fa-solid fa-file-code" style="color: #f1fa8c;"></i> nkpalin.md
                </li>
                <li class="tree-file" data-path="codehub/vnoi/lis" onclick="changePage('codehub/vnoi/lis')">
                  <i class="fa-solid fa-file-code" style="color: #ffb86c;"></i> lis.md
                </li>
              </ul>
            </li>
            <li class="tree-folder">
              <span class="folder-toggle"><i class="fa-solid fa-chevron-down"></i> <i class="fa-solid fa-folder" style="color: #50fa7b;"></i> cyb</span>
              <ul class="folder-contents">
                <li class="tree-file" data-path="codehub/cyb/port" onclick="changePage('codehub/cyb/port')">
                  <i class="fa-solid fa-file-code" style="color: #ff5555;"></i> port.md
                </li>
              </ul>
            </li>
          </ul>
        </li>
      </ul>
      <div class="sidebar-footer">
        <a href="../index.html" class="back-home-btn">
          <i class="fa-solid fa-arrow-left"></i> Home Portfolio
        </a>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="ide-main">
      <!-- Tabs header -->
      <header class="editor-tabs-header" id="tabs-header">
        <!-- Dynamic tabs will be loaded by JS -->
      </header>

      <!-- Editor Content -->
      <div id="content" class="editor-body">
        <!-- Content will be loaded by JavaScript -->
      </div>

      <!-- Status Bar -->
      <footer class="ide-status-bar">
        <div class="status-left">
          <span class="mode mode--normal">NORMAL</span>
          <span class="filepath" id="active-filepath">hd929.github.io/dev/algorithm/segmenttree.md</span>
        </div>
        <div class="status-right">
          <span class="lang">markdown</span>
          <span class="encoding">utf-8</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="../assets/scripts/particles.js?v=1.3"></script>
  <script src="./script.js?v=1.3"></script>
</body>

</html>
